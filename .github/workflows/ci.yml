name: CI

on:
  pull_request:
  push:
    branches:
      - build-week-2026
      - main

permissions:
  contents: read

jobs:
  quality-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.29"
          enable-cache: false

      - name: Create frozen Python environment
        run: make install

      - name: Record managed toolchain
        run: |
          uv --version
          .venv/bin/python --version
          sha256sum requirements.lock

      - name: Validate public seed
        run: make seed-check

      - name: Run full test suite
        run: make test

      - name: Lint
        run: make lint

      - name: Type check
        run: make type-check

      - name: Enforce clean-room public release gate
        run: make release-scan
